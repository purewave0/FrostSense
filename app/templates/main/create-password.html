<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Create Password - FrostSense</title>
        <link rel="stylesheet" href="/static/css/global.css" />
        <link rel="stylesheet" href="/static/css/lib/toastify.min.css" />
        <link rel="stylesheet" href="/static/css/create-password.css" />
    </head>
    <body>
        <div id="content">
            <form id="password-form">
                <p>
                    Your account currently has a temporary password.
                    <br />
                    Before proceeding, please create a new password below:
                </p>
                <div class="form-field">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        required
                        minlength="8"
                        maxlength="100"
                        autofocus
                    />
                    <span class="form-field-helper">At least 8 characters</span>
                </div>

                <div class="form-field">
                    <label for="password-confirm">Confirm password</label>
                    <input
                        type="password"
                        id="password-confirm"
                        required
                        minlength="8"
                        maxlength="100"
                    />
                </div>

                <button id="confirm">Apply</button>
            </form>
        </div>

        <a href="/logout" id="logout">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="#e3e3e3"
            >
                <path
                    d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h280v80H200Zm440-160-55-58 102-102H360v-80h327L585-622l55-58 200 200-200 200Z"
                />
            </svg>
            <span>Log out</span>
        </a>

        <script src="/static/js/lib/toastify.min.js"></script>
        <script src="/static/js/global.js"></script>
        <script src="/static/js/api.js"></script>
        <script src="/static/js/create-password.js"></script>
    </body>
</html>
