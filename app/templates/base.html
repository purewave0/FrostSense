<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %} {% endblock %} - FrostSense</title>
    <link rel="stylesheet" href="/static/css/global.css">
    {% block css %} {% endblock %}
</head>
<body>
    <div id="content">
        <nav id="sidebar">
            <a href="/readings">Readings</a>
            <a href="/history">History</a>
            <a href="/sensors">Sensors</a>
            <a href="/reports">Reports</a>
            <a href="/verify-reports">Verify Reports</a>
        </nav>

        <div>
            <header id="header">
                <h1 id="page-title">{{ self.title() }}</h1>
            </header>
            <div id="page-content">
                {% block content %} {% endblock %}
            </div>
        </div>
    </div>

    <script src="/static/js/global.js"></script>
    {% block js %} {% endblock %}
</body>
</html>
